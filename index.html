<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iTremind</title>
<meta name="description" content="iTremind is a personal Life OS for tasks, habits, goals, routine, calendar and notes.">
<meta name="theme-color" content="#050706">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23050706'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2310b981'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#050706; --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08); --text:#f2f5f3; --soft:#9aa6a0; --faint:#5f6b65;
  --em:#10b981; --em-deep:#0b5d43; --em-glow:rgba(16,185,129,.18);
  --font:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--em);outline-offset:2px;border-radius:8px}

/* ambient background */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.orb.a{width:46vmax;height:46vmax;left:-14vmax;top:-18vmax;background:radial-gradient(circle,var(--em-deep),transparent 68%);animation:drift1 26s ease-in-out infinite alternate}
.orb.b{width:38vmax;height:38vmax;right:-12vmax;bottom:-14vmax;background:radial-gradient(circle,#073b2b,transparent 68%);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vmax,-6vmax) scale(1.08)}}

/* shell */
.shell{position:relative;z-index:1;min-height:100%;display:grid;grid-template-columns:1fr}
.rail{display:none}
.main{padding:20px 18px 110px;max-width:1080px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:space-around;padding:8px;border-radius:22px;background:rgba(10,14,12,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);padding:6px 10px;border-radius:14px;transition:color .25s,background .25s,transform .2s var(--ease)}
.tab svg,.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab:active,.nav:active{transform:scale(.94)}
.tab.on{color:var(--em);background:var(--em-glow)}

@media(min-width:900px){
  .shell{grid-template-columns:240px 1fr}
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line)}
  .main{padding:36px 40px 60px}
}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:-.01em;margin-bottom:26px;padding-left:10px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--em);box-shadow:0 0 14px var(--em);animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 4px var(--em);opacity:.7}}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--soft);transition:background .25s,color .25s,transform .2s var(--ease)}
.nav:hover{background:var(--surface);color:var(--text)}
.nav.on{background:var(--em-glow);color:var(--em)}

/* page */
.page{animation:pageIn .5s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
h1{font-size:clamp(26px,5vw,38px);font-weight:300;letter-spacing:-.025em;line-height:1.15}
h1 b{font-weight:600}
.date{color:var(--soft);font-size:14px;margin-top:6px}
h2{font-size:15px;font-weight:500;letter-spacing:-.005em}
.sub{color:var(--faint);font-size:12.5px}

.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:repeat(6,1fr)}.c-hero{grid-column:span 6}.c-3{grid-column:span 3}.c-2{grid-column:span 2}.c-4{grid-column:span 4}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:cardIn .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.link{color:var(--em);font-size:12.5px}

/* hero */
.hero{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(255,255,255,.02) 60%)}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.07)}
.ring .fg{stroke:var(--em);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.1s var(--ease);filter:drop-shadow(0 0 6px rgba(16,185,129,.5))}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:300;letter-spacing:-.03em}
.ring .num small{font-size:14px;color:var(--soft);margin-left:1px}
.hero h2{font-size:18px;font-weight:500;margin-bottom:4px}
.hero p{color:var(--soft);font-size:13.5px;max-width:34ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--surface-2);color:var(--soft)}
.chip b{color:var(--text);font-weight:500}

/* rows */
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;margin:0 -8px;border-radius:12px;transition:background .2s,transform .15s var(--ease);width:calc(100% + 16px)}
.row:hover{background:var(--surface-2)}
.row:active{transform:scale(.985)}
.box{width:20px;height:20px;flex:none;border-radius:7px;border:1.5px solid var(--faint);display:grid;place-items:center;transition:background .25s,border-color .25s}
.box svg{width:12px;height:12px;stroke:#04110c;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s var(--ease)}
.done .box{background:var(--em);border-color:var(--em)}
.done .box svg{stroke-dashoffset:0}
.row .t{flex:1;min-width:0;transition:color .25s}
.done .t{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}
.meta{font-size:12px;color:var(--faint);white-space:nowrap}
.tag{width:7px;height:7px;border-radius:50%;flex:none}
.p-high{background:#e5a24a}.p-mid{background:var(--em)}.p-low{background:var(--faint)}
.time{font-size:12.5px;color:var(--soft);width:44px;flex:none;font-variant-numeric:tabular-nums}
.now .time{color:var(--em)}
.now{background:var(--em-glow);border-radius:12px}
.pill{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--em);color:#04110c;font-weight:600}

/* bars */
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--em-deep),var(--em));transition:width 1s var(--ease)}
.goal{padding:10px 0}
.goal+.goal{border-top:1px solid var(--line)}
.goal .top{display:flex;justify-content:space-between;margin-bottom:8px}
.streak{display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.1)}
.dot.on{background:var(--em)}

/* section links */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--surface-2);transition:transform .25s var(--ease),background .25s,box-shadow .25s}
.tile:hover{transform:translateY(-3px);background:rgba(16,185,129,.1);box-shadow:0 8px 24px -12px rgba(16,185,129,.5)}
.tile:active{transform:scale(.97)}
.tile svg{width:20px;height:20px;stroke:var(--em);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile span{font-size:12px;color:var(--faint)}

/* tasks */
.tform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tform input[type=text],.tform input:not([type]){grid-column:1/-1}
@media(min-width:760px){.tform{grid-template-columns:1fr 130px 120px auto}.tform input:not([type]){grid-column:auto}}
input,select{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0;transition:border-color .25s,box-shadow .25s}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:0;border-color:var(--em);box-shadow:0 0 0 3px var(--em-glow)}
select option{background:#0b0f0d}
.btn{background:var(--em);color:#04110c;font-weight:600;padding:11px 18px;border-radius:12px;text-align:center;transition:transform .2s var(--ease),box-shadow .25s}
.btn:hover{box-shadow:0 6px 22px -6px rgba(16,185,129,.7)}.btn:active{transform:scale(.96)}
.filters{display:flex;gap:6px;margin-bottom:10px}
.fbtn{padding:6px 14px;border-radius:99px;font-size:13px;color:var(--soft);background:var(--surface-2);transition:background .25s,color .25s}
.fbtn.on{background:var(--em-glow);color:var(--em)}
.trow{display:flex;align-items:center;gap:4px}
.trow .row{flex:1;width:auto;margin:0}
.x{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--faint);transition:background .2s,color .2s,transform .15s}
.x:hover{background:var(--surface-2);color:#e5707a}.x:active{transform:scale(.9)}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.none{padding:26px 0;text-align:center;color:var(--faint)}

/* habits */
.hform{display:grid;grid-template-columns:1fr auto;gap:10px}
.sm{display:block;font-size:12px;color:var(--faint);margin-top:1px}
.dot.today{outline:1.5px solid rgba(16,185,129,.5);outline-offset:2px}
.streak{gap:5px}

/* shared forms, calendar, notes, progress */
.tform2{display:flex;flex-wrap:wrap;gap:10px}.tform2 input[name=title],.tform2 textarea{flex:1 1 200px}
textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;resize:vertical;min-height:90px}
textarea:focus{outline:0;border-color:var(--em)}
input[type=range]{width:100%;accent-color:var(--em);padding:0;margin-top:10px;background:none;border:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal>span{font-size:12px;color:var(--faint);padding:4px 0}
.d{aspect-ratio:1;max-height:56px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--soft);transition:background .2s,transform .15s}
.d:hover{background:var(--surface-2)}.d:active{transform:scale(.92)}
.d.tod{outline:1.5px solid rgba(16,185,129,.55)}.d.sel{background:var(--em);color:#04110c;font-weight:600}
.d i{position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--em)}.d.sel i{background:#04110c}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cal-h .x{font-size:22px}
.notes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:14px}
.notes .card{display:flex;flex-direction:column;gap:8px}.notes textarea{min-height:120px;background:none;border-color:transparent;padding:4px}
.notes textarea:focus{background:var(--surface-2)}
.chart{display:flex;align-items:flex-end;gap:10px;height:160px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.col i{display:block;width:100%;max-width:36px;min-height:3px;height:0;border-radius:8px 8px 4px 4px;background:linear-gradient(0deg,var(--em-deep),var(--em));transition:height 1s var(--ease)}
.col span{font-size:11px;color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.big{font-size:30px;font-weight:300;letter-spacing:-.03em}

/* placeholder */
.empty{display:grid;place-items:center;text-align:center;gap:10px;min-height:46vh;color:var(--soft)}
.empty h2{font-size:22px;font-weight:400;color:var(--text)}
.empty p{max-width:36ch}

@media(max-width:520px){.hero{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

/* ================= POLISH LAYER (visual only) ================= */
::selection{background:rgba(16,185,129,.3)}
html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
body{background:radial-gradient(120% 70% at 50% -10%,#0b1a14 0%,var(--bg) 55%);font-feature-settings:'tnum' 1,'ss01' 1;letter-spacing:-.003em}
.orb.c{width:30vmax;height:30vmax;left:38%;top:42%;background:radial-gradient(circle,rgba(16,185,129,.16),transparent 66%);animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift3{to{transform:translate(-12vmax,8vmax) scale(1.18)}}
.orbs::after{content:'';position:absolute;inset:0;background:radial-gradient(100% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55))}

/* typography */
h1{font-weight:300;letter-spacing:-.035em}
h1 b{font-weight:600;background:linear-gradient(120deg,#fff,#8fe8c6);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:500;letter-spacing:-.01em}
.date{letter-spacing:.01em}
.head{margin-bottom:26px}

/* cards */
.card{position:relative;border-radius:24px;padding:20px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.018) 55%);border:1px solid rgba(255,255,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px -24px rgba(0,0,0,.8);transition:border-color .35s,box-shadow .35s,transform .35s var(--ease)}
@media(hover:hover){.card:hover{border-color:rgba(16,185,129,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 50px -26px rgba(16,185,129,.35)}}
.card-head{margin-bottom:14px}
.link{padding:4px 10px;margin:-4px -10px;border-radius:99px;transition:background .25s}
.link:hover{background:var(--em-glow)}
.hero{background:radial-gradient(90% 140% at 0% 0%,rgba(16,185,129,.16),transparent 60%),linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.ring .fg{filter:drop-shadow(0 0 8px rgba(16,185,129,.6))}
.ring .num{font-weight:200;font-size:34px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.035)}

/* rows */
.row{min-height:46px;border-radius:14px}
.box{border-radius:8px;border-color:rgba(255,255,255,.28)}
.done .box{box-shadow:0 0 12px rgba(16,185,129,.45)}
.now{background:linear-gradient(90deg,rgba(16,185,129,.16),rgba(16,185,129,.04))}
.bar{height:6px}
.bar i{box-shadow:0 0 10px rgba(16,185,129,.4)}
.goal{padding:12px 0}

/* buttons & inputs */
.btn{background:linear-gradient(135deg,#17c68f,#0d8f67);box-shadow:0 8px 20px -10px rgba(16,185,129,.8),inset 0 1px 0 rgba(255,255,255,.25);min-height:44px;transition:transform .2s var(--ease),box-shadow .3s,filter .3s}
.btn:hover{filter:brightness(1.08);box-shadow:0 10px 26px -8px rgba(16,185,129,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.fbtn{min-height:34px;border:1px solid transparent}
.fbtn.on{border-color:rgba(16,185,129,.3)}
.x{width:38px;height:38px}
input,select,textarea{background:rgba(255,255,255,.04);min-height:44px}
textarea{min-height:90px}
input[type=range]{min-height:0}

/* navigation */
.tabbar{left:50%;right:auto;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:rgba(8,12,10,.8);border-color:rgba(255,255,255,.09);box-shadow:0 20px 50px -12px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);padding:6px}
.tab{flex:1;min-height:52px;justify-content:center;border-radius:18px;font-size:10.5px;letter-spacing:.01em}
.tab.on{background:linear-gradient(180deg,rgba(16,185,129,.22),rgba(16,185,129,.08));box-shadow:inset 0 0 0 1px rgba(16,185,129,.25)}
.nav{position:relative}
.nav.on::before{content:'';position:absolute;left:-18px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--em);box-shadow:0 0 12px var(--em)}
.rail{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.brand{font-size:19px;letter-spacing:-.02em}
.tile{border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.tile:hover{border-color:rgba(16,185,129,.3)}

/* calendar & misc */
.d{border-radius:14px}.d.sel{box-shadow:0 6px 18px -6px rgba(16,185,129,.7)}
.notes textarea{line-height:1.55}
.none{padding:30px 0}

/* mobile */
@media(max-width:600px){
  .main{padding:16px 14px 118px}
  .card{padding:16px;border-radius:22px}
  .grid{gap:12px}
  h1{font-size:27px}
  .ring{width:112px;height:112px}.ring .num{font-size:28px}
  input,select,textarea{font-size:16px}
  .tform{grid-template-columns:1fr 1fr}
  .tform .btn{grid-column:1/-1}
  .tform2 .btn{flex:1 1 100%}
  .hform{grid-template-columns:1fr}
}
@media(min-width:900px){.card{padding:22px}.grid{gap:16px}}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="main" id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Primary"></nav>

<script>
/* ============ 1. DATA (sample data; swap for real storage later) ============ */
const dk = (o = 0) => { const d = new Date(); d.setDate(d.getDate() - o); return d.toLocaleDateString('en-CA'); }; // local YYYY-MM-DD
const seedLog = (n, today) => Array.from({ length: n }, (_, i) => dk(i + (today ? 0 : 1)));
const store = {
  user: { name: 'Alex' },
  tasks: [
    { id: 1, title: 'Send project proposal to Maya', due: '10:00', p: 'high', done: true },
    { id: 2, title: 'Book dentist appointment', due: '12:30', p: 'low', done: false },
    { id: 3, title: 'Review Q4 budget draft', due: '14:00', p: 'high', done: false },
    { id: 4, title: 'Pick up groceries', due: '18:00', p: 'mid', done: false },
    { id: 5, title: 'Call Mom', due: '19:30', p: 'mid', done: false },
  ],
  // habits keep a log of completed dates; "done today" and streak are derived from it
  habits: [['Drink 2L of water', 12, 1], ['Read 20 pages', 5, 1], ['Meditate 10 min', 21, 0], ['No phone before 9am', 3, 0]]
    .map(([title, n, d], i) => ({ id: i + 1, title, log: seedLog(n, d) })),
  routine: [
    { id: 1, time: '06:30', title: 'Wake up & stretch', done: true },
    { id: 2, time: '07:15', title: 'Workout', done: true },
    { id: 3, time: '09:00', title: 'Deep work block', done: false },
    { id: 4, time: '13:00', title: 'Lunch away from screen', done: false },
    { id: 5, time: '18:30', title: 'Evening walk', done: false },
    { id: 6, time: '22:00', title: 'Wind down & journal', done: false },
  ],
  goals: [
    { id: 1, title: 'Run a half marathon', progress: 62, due: 'Apr 2027' },
    { id: 2, title: 'Save $5,000 emergency fund', progress: 78, due: 'Dec 2026' },
    { id: 3, title: 'Learn conversational Spanish', progress: 34, due: 'Jun 2027' },
  ],
};

/* Persistence: tasks and habits. Routine comes later. */

const HKEY = 'itremind.habits.v1';
try { const saved = JSON.parse(localStorage.getItem(HKEY)); if (Array.isArray(saved)) store.habits = saved; } catch (e) {}

function buildNav() {

function route() {
  const id = (location.hash.replace('#/', '') || 'dashboard');
  const s = sections.find(x => x.id === id) || sections[0];
  $('#view').innerHTML = s.id === 'dashboard' ? Dashboard() : V[s.id] ? V[s.id]() : Placeholder(s);
  document.querySelectorAll('[data-nav]').forEach(a => { const on = a.dataset.nav === s.id; a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });

  if (s.id === 'dashboard') { setTimeout(sync, 250); growBars(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-toggle]'); if (!b) return;
  const it = store[b.dataset.toggle].find(x => x.id == b.dataset.id);
  it.done = !it.done;
  b.classList.toggle('done', it.done); b.setAttribute('aria-pressed', it.done);
  if (b.dataset.toggle === 'tasks') { save(); if ($('#taskList')) renderTasks(); }
  if (b.dataset.toggle === 'habits') { syncHabit(it); const m = b.querySelector('.meta'); if (m) m.textContent = streakText(it); if ($('#habitList')) renderHabits(); }
  if (b.dataset.toggle === 'routine') { it.doneOn = it.done ? dk(0) : null; persist('routine'); if ($('#routineList')) renderRoutine(); }
  sync();
});

  e.preventDefault();
  const title = $('#hTitle').value.trim(); if (!title) return;
  store.habits.push(hydrate({ id: Date.now(), title: esc(title), log: [] }));
  saveH(); e.target.reset(); renderHabits(); $('#hTitle').focus();
});
const V = { tasks: Tasks, habits: Habits, goals: Goals, routine: Routine, calendar: Calendar, notes: Notes, progress: Progress };
const R = { tasks: renderTasks, habits: renderHabits, goals: renderGoals, routine: renderRoutine, calendar: renderCal, notes: renderNotes, progress: renderProgress };
const rerender = () => { const f = R[location.hash.replace('#/', '')]; if (f) f(); };
document.addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]'), c = e.target.closest('[data-cal]'), d = e.target.closest('[data-day]');
  if (rm) { const [t, id] = rm.dataset.rm.split(':'); store[t] = store[t].filter(x => x.id != id); persist(t); rerender(); }
  if (c) { calM.setMonth(calM.getMonth() + +c.dataset.cal); rerender(); }
  if (d) { calSel = d.dataset.day; rerender(); }
});
document.addEventListener('input', e => {
  const g = e.target.dataset.gp, n = e.target.dataset.note;
  if (g) { const x = store.goals.find(i => i.id == g); x.progress = +e.target.value; $('#gp' + g).textContent = x.progress; $('#gb' + g).style.width = x.progress + '%'; persist('goals'); }
  if (n) { store.notes.find(i => i.id == n).text = e.target.value; persist('notes'); }
});
document.addEventListener('submit', e => {
  const t = e.target.dataset.add; if (!t) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(e.target)), id = Date.now();
  if (t === 'goals') store.goals.push({ id, title: esc(v.title.trim()), progress: 0, due: esc(v.due.trim()) });
  if (t === 'routine') { store.routine.push({ id, time: v.time, title: esc(v.title.trim()), done: false, doneOn: null }); store.routine.sort((a, b) => a.time.localeCompare(b.time)); }
  if (t === 'events') store.events.push({ id, date: calSel, title: esc(v.title.trim()), time: v.time });
  if (t === 'notes') store.notes.unshift({ id, text: v.text.trim(), at: dk(0) });
  persist(t); e.target.reset(); rerender();
});
window.addEventListener('hashchange', route);
buildNav(); route();
</script>
